[project]
name = "rl-commons"
version = "0.1.0"
description = "Shared utilities for RL and world model projects"
requires-python = "==3.12.*"
dependencies = [
    "ml-commons",
    "torch>=2.0",
    "numpy>=2.0",
    "gymnasium[box2d,mujoco]>=1.0",
    "gym-pusht>=0.1",
    "pymunk<7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/rl_commons"]

[tool.uv.sources]
ml-commons = { git = "https://github.com/kieranparanjpe/ml-commons.git" }

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
